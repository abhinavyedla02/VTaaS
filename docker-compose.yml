

services:
  db:
    image: postgres:16-alpine
    container_name: vtaas_db
    environment:
      POSTGRES_USER: vtaas
      POSTGRES_PASSWORD: vtaas
      POSTGRES_DB: vtaas
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtaas -d vtaas || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:latest
    container_name: vtaas_localstack
    environment:
      - SERVICES=s3,sqs
      - DEBUG=1
      - LS_LOG=info
      - DOCKER_HOST=unix:///var/run/docker.sock
    ports:
      - "4566:4566"        # LocalStack edge port (all services)
    volumes:
      - "localstackdata:/var/lib/localstack"
      # docker.sock not strictly needed for s3/sqs, but harmless; uncomment if you ever add lambdas
      # - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health').read()\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: vtaas-api:dev
    container_name: vtaas_api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://vtaas:vtaas@db:5432/vtaas
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - ENQUEUE_ENABLED=true
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: vtaas-web:dev
    container_name: vtaas_web
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped


volumes:
  dbdata:
  localstackdata:
